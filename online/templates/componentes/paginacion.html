<nav class="pagination" aria-label="Páginas">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&tipo={{ request.GET.tipo|urlencode }}&categoria={{ request.GET.categoria|urlencode }}&estado={{ request.GET.estado|urlencode }}&prioridad={{ request.GET.prioridad|urlencode }}">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&tipo={{ request.GET.tipo|urlencode }}&categoria={{ request.GET.categoria|urlencode }}&estado={{ request.GET.estado|urlencode }}&prioridad={{ request.GET.prioridad|urlencode }}">Siguiente</a>{% endif %}</nav>
